name: Build downloadable test apps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Unique release tag, for example v0.3.0-test.1"
        required: true
        default: "v0.3.0-test.1"
        type: string

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-22.04
          - target: Windows
            os: windows-2022
          - target: Linux
            os: ubuntu-22.04
          - target: macOS
            os: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java for Android
        if: matrix.target == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux desktop dependencies
        if: matrix.target == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android test APK
        if: matrix.target == 'Android'
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          mkdir -p downloads
          cp build/app/outputs/flutter-apk/app-release.apk \
            downloads/LCCT-Android-test.apk

      - name: Build Windows installer
        if: matrix.target == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) {
            throw "Could not enable Windows desktop."
          }

          flutter build windows --release
          if ($LASTEXITCODE -ne 0) {
            throw "Windows build failed."
          }

          New-Item -ItemType Directory -Force downloads | Out-Null
          New-Item -ItemType Directory -Force packaging/windows/prerequisites | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "packaging/windows/prerequisites/vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "packaging/windows/prerequisites/MicrosoftEdgeWebview2Setup.exe"
          foreach ($file in Get-ChildItem packaging/windows/prerequisites/*.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
              throw "Microsoft prerequisite signature validation failed: $($file.Name)"
            }
          }
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }
          & $iscc packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }

      - name: Build Linux packages
        if: matrix.target == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-linux-desktop
          flutter build linux --release
          mkdir -p downloads
          tar -czf downloads/LCCT-Linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .
          bash packaging/linux/build-deb.sh

      - name: Build unsigned macOS DMG
        if: matrix.target == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          flutter config --enable-macos-desktop
          flutter build macos --release --config-only

          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos-ci \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          mkdir -p downloads

          APP="$(find build/macos-ci/Build/Products/Release \
            -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP" ]; then
            echo "No macOS application bundle was found."
            exit 1
          fi

          mkdir -p build/dmg-stage
          ditto "$APP" "build/dmg-stage/LCCT Help Desk.app"
          ln -s /Applications build/dmg-stage/Applications
          hdiutil create -volname "LCCT Help Desk" \
            -srcfolder build/dmg-stage -ov -format UDZO \
            downloads/LCCT-macOS-unsigned-test.dmg

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LCCT-${{ matrix.target }}
          path: downloads/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft download release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-downloads
          sha256sum LCCT-* > SHA256SUMS.txt

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid tag. Use a value such as v0.3.0-test.1."
            exit 1
          fi

          if [ ! -f RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md is missing from the repository."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            release-downloads/* \
            --target "$GITHUB_SHA" \
            --draft \
            --prerelease \
            --title "LCCT Help Desk $RELEASE_TAG - class testing" \
            --notes-file RELEASE_NOTES.md
