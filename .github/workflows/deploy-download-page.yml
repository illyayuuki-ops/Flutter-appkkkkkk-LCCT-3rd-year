name: Publish download website

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy-download-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: download-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy download website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package website
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f docs/index.html ]; then
            echo "Missing docs/index.html"
            exit 1
          fi

          tar \
            --dereference \
            --hard-dereference \
            --directory docs \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            .

      - name: Upload website package
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
